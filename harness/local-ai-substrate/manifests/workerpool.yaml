apiVersion: v1
kind: Namespace
metadata:
  name: local-ai
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: ai-agent-pool
  namespace: local-ai
  labels:
    workload: local-ai-agent
spec:
  replicas: 2
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
  - name: gvisor
  template:
    resources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 512Mi

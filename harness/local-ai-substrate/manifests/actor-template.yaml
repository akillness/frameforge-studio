metadata:
  atespace: local-ai
  name: local-ai-agent
workerSelector:
  matchLabels:
    workload: local-ai-agent
containers:
- name: agent
  image: localhost:5001/local-ai-agent@sha256:d052cf9be7a4c30895c4b5fd2261a3b7d9408a05cbc19fa3d29e791c9af6554a
  command: ["python3", "/app/server.py"]
  env:
  - name: QEV_URL
    value: http://host.docker.internal:8080/v1/systemone
  - name: QEV_MODEL
    value: labqoat/qev-0.8b-GGUF:text-Q8_0
  - name: LLM_URL
    value: http://host.docker.internal:8081/v1/chat/completions
  - name: LLM_MODEL
    value: qwen3.5-9b
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
  volumeMounts:
  - name: data
    mountPath: /home/agent
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 268435456
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
volumes:
- name: data
  durableDir: {}

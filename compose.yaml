services:
  studio:
    build: .
    image: frameforge-studio:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:4310:4310"
    environment:
      LOGIN_TOKEN: ${LOGIN_TOKEN:?Run node scripts/configure.mjs first}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      AGENT_BRIDGE_URL: http://host.docker.internal:4311
      AGENT_BRIDGE_TOKEN: ${AGENT_BRIDGE_TOKEN:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - studio-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
volumes:
  studio-data:

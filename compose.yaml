services:
  studio:
    build: .
    image: frameforge-studio:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_PORT:-4310}:4310"
    environment:
      LOGIN_TOKEN: ${LOGIN_TOKEN:?Run node scripts/configure.mjs first}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      AGENT_BRIDGE_URL: ${HOST_AGENT_BRIDGE_URL:-http://host.docker.internal:4311}
      AGENT_BRIDGE_TOKEN: ${AGENT_BRIDGE_TOKEN:-}
      SPEECH_PROVIDER: host-bridge
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/chromium-config
      XDG_CACHE_HOME: /tmp/chromium-cache
      HF_API_KEY: ${HF_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      MEDIA_USER_AGENT: ${MEDIA_USER_AGENT:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
      YOUTUBE_OAUTH_TESTING: "${YOUTUBE_OAUTH_TESTING:-false}"
      AGENT_API_ALLOW_PAID_GENERATION: "${AGENT_API_ALLOW_PAID_GENERATION:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - studio-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
volumes:
  studio-data:

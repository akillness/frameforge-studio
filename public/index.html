<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>FrameForge · 채널을 위한 제작 스튜디오</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/workflow.css">
  <link rel="stylesheet" href="/workspace.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">작업 영역으로 이동</a>
  <div id="app"><div class="loading">FRAMEFORGE <span>스튜디오를 불러오는 중…</span></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><form id="modal-form"><div id="modal-content"></div><div class="dialog-actions"><button type="button" id="modal-cancel">취소</button><button class="primary" type="submit">만들기</button></div></form></dialog>
  <input hidden type="file" id="media-file" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm">
  <input hidden type="file" id="audio-file" accept="audio/mpeg,audio/wav,audio/x-wav,audio/ogg,.mp3,.wav,.ogg">
</body>
</html>
